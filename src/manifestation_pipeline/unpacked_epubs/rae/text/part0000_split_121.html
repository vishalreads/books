<h1 class="calibre13" id="calibre_pb_240">Day 25</h1>

<h2 class="calibre14"><img border="0" id="Picture 52" src="../images/00046.jpeg" class="calibre51"/></h2>

<p class="msonormal6"><i class="calibre2"><span class="calibre7">As you look at this picture, let go
of old expectations. Live in the moment with your soulmate. If a past memory
comes up, gently remind it that it doesn’t serve you anymore. Say goodbye to
all of your exes, and see them walking away. Embrace your soulmate.</span></i></p>
