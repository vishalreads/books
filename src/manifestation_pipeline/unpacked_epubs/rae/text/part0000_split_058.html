<h2 class="calibre18" id="calibre_pb_133">Journal Exercise</h2>

<p class="msonormal6">Write
out a day of complete fun with your soulmate. Pick your favorite hobby, and
write your day out together. Write it from your point of view to your soulmate,
and write it from your soulmate’s point of view to you.</p>
